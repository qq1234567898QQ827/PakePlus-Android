<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追及相遇动画 - 齐老师动画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #162a44, #1e3a5f, #274472);
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #a8d8ff;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.6);
        }

        .top-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .animation-box {
            height: 320px;
            position: relative;
            background: rgba(10, 25, 50, 0.7);
            border: 2px solid #4aa8ff;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(74, 168, 255, 0.3);
            overflow: hidden;
        }

        /* 跑道与轨迹层：整体平移实现镜头跟随 */
        .track-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ground {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 2500px;
            height: 2px;
            background: #4aa8ff;
        }

        /* 坐标轴刻度文字：每小格 10 m */
        .ruler-text {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            font-family: "Microsoft YaHei", sans-serif;
            fill: #ffffff;
            paint-order: stroke;
            stroke: rgba(6, 18, 38, 0.9);
            stroke-width: 3px;
        }

        .track-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 2500px;
            height: 100%;
            pointer-events: none;
        }

        .police-path {
            fill: none;
            stroke: #ff4d4d;
            stroke-width: 2.5;
            stroke-dasharray: 8 4;
            stroke-linecap: round;
        }

        .thief-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-dasharray: 8 4;
            stroke-linecap: round;
        }

        .distance-line {
            fill: none;
            stroke: #ffd700;
            stroke-width: 2;
            stroke-dasharray: 6 3;
            stroke-linecap: round;
        }

        /* 速度箭头与标注 */
        .v-arrow {
            stroke-width: 3;
            stroke-linecap: round;
        }
        .v-label {
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            font-family: "Microsoft YaHei", sans-serif;
            paint-order: stroke;
            stroke: rgba(6, 18, 38, 0.85);
            stroke-width: 3px;
        }
        .gap-label {
            font-size: 15px;
            font-weight: bold;
            text-anchor: middle;
            font-family: "Microsoft YaHei", sans-serif;
            paint-order: stroke;
            stroke: rgba(6, 18, 38, 0.85);
            stroke-width: 3px;
        }

        /* 角色层：固定在画布上层，大小永远不变 */
        .character-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* 情景框顶部居中说明 */
        .scene-note {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.95), 0 2px 5px rgba(0, 0, 0, 0.85);
            pointer-events: none;
        }

        .police {
            position: absolute;
            bottom: 36px;
            z-index: 10;
        }
        .police img {
            height: 95px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 120, 50, 0.7));
        }

        .thief {
            position: absolute;
            bottom: 40px;
            z-index: 10;
        }
        .thief img {
            height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(200, 180, 255, 0.7));
        }

        /* ===== 质点模式 ===== */
        .particle {
            display: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .police .particle {
            background: #ff2020;
            box-shadow: 0 0 16px 4px rgba(255, 32, 32, 0.75);
        }
        .thief .particle {
            background: #ffffff;
            box-shadow: 0 0 16px 4px rgba(255, 255, 255, 0.75);
        }
        body.particle-mode .police img,
        body.particle-mode .thief img {
            display: none;
        }
        body.particle-mode .particle {
            display: block;
        }
        body.particle-mode .police,
        body.particle-mode .thief {
            bottom: 28px;
        }

        .control-panel {
            width: 280px;
            flex-shrink: 0;
            background: rgba(15, 30, 60, 0.8);
            border: 1px solid #4aa8ff;
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(8px);
        }

        .param-group {
            margin-bottom: 16px;
        }

        .param-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b8d4ff;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #4aa8ff, #8ec5fc);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #4aa8ff;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #4aa8ff, #8ec5fc);
            color: #0a1a33;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(74, 168, 255, 0.4);
        }

        .btn.reset {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
        }

        .btn.preset {
            background: linear-gradient(45deg, #ffd76a, #fff3c4);
        }

        .btn.particle-btn {
            background: linear-gradient(45deg, #7cf5c0, #d8ffee);
        }

        .btn.running {
            background: linear-gradient(45deg, #ffa04d, #ffd9a8);
        }

        .btn.particle-btn.active {
            background: linear-gradient(45deg, #b39cff, #e2d9ff);
        }

        /* 功能按钮栏（紧贴 v-t 图像框下方） */
        .action-bar {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .action-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .action-bar .btn {
            width: 182px;
            margin-bottom: 0;
            padding: 12px 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .preset-note {
            font-size: 14px;
            color: #ffd76a;
            text-align: center;
            line-height: 1.6;
            margin: 0;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 16px;
        }
        .preset-note.show {
            opacity: 1;
        }

        .speed-select {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            background: #0f1e3c;
            color: #fff;
            border: 1px solid #4aa8ff;
            outline: none;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(74, 168, 255, 0.3);
            font-size: 14px;
        }

        .graph-box {
            background: rgba(15, 30, 60, 0.8);
            border: 1px solid #4aa8ff;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .graph-box h3 {
            margin-bottom: 8px;
            color: #a8d8ff;
            font-size: 15px;
        }

        #vtCanvas {
            width: 100%;
            height: 200px;
            background: rgba(10, 20, 40, 0.9);
            border-radius: 8px;
            display: block;
        }

        .meet-tip {
            text-align: center;
            color: #00ff99;
            font-weight: bold;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
        }
        .meet-tip.show {
            opacity: 1;
        }
    </style>

                </div>

                <button class="btn" id="startBtn">开始</button>
                <button class="btn reset" id="resetBtn">重置</button>

                <div style="margin-top: 15px;">
                    <div class="data-row"><span>已用时间:</span><span id="timeShow">0 s</span></div>
                    <div class="data-row"><span>警察位移:</span><span id="s1Show">0 m</span></div>
                    <div class="data-row"><span>小偷位移:</span><span id="s2Show">0 m</span></div>
                    <div class="data-row"><span>两者间距:</span><span id="gapShow">200 m</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 元素获取 ==========
        const track = document.getElementById('track');
        const trackLayer = document.getElementById('trackLayer');
        const policePath = document.getElementById('policePath');
        const thiefPath = document.getElementById('thiefPath');
        const distanceLine = document.getElementById('distanceLine');
        const policeEl = document.getElementById('police');
        const thiefEl = document.getElementById('thief');
        const v1Input = document.getElementById('v1');
        const v2Input = document.getElementById('v2');
        const s0Input = document.getElementById('s0');
        const a1Input = document.getElementById('a1');
        const a2Input = document.getElementById('a2');
        const v1Val = document.getElementById('v1Val');
        const v2Val = document.getElementById('v2Val');
        const s0Val = document.getElementById('s0Val');
        const a1Val = document.getElementById('a1Val');
        const a2Val = document.getElementById('a2Val');
        const speedRate = document.getElementById('speedRate');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const presetBtn = document.getElementById('presetBtn');
        const preset2Btn = document.getElementById('preset2Btn');
        const preset3Btn = document.getElementById('preset3Btn');
        const particleBtn = document.getElementById('particleBtn');
        const presetNote = document.getElementById('presetNote');
        const timeShow = document.getElementById('timeShow');
        const s1Show = document.getElementById('s1Show');
        const s2Show = document.getElementById('s2Show');
        const gapShow = document.getElementById('gapShow');
        const meetTip = document.getElementById('meetTip');
        const canvas = document.getElementById('vtCanvas');
        const ctx = canvas.getContext('2d');
        const policeArrow = document.getElementById('policeArrow');
        const thiefArrow = document.getElementById('thiefArrow');
        const policeVLabel = document.getElementById('policeVLabel');
        const thiefVLabel = document.getElementById('thiefVLabel');
        const gapLabel = document.getElementById('gapLabel');
        const rulerGroup = document.getElementById('ruler');
        const groundEl = document.querySelector('.ground');

        // ========== 物理参数 ==========
        let v1 = 8;
        let v2 = 3;
        let s0 = 200;
        let a1 = 0;
        let a2 = 0;
        let time = 0;
        let running = false;
        let rafId = 0;
        let rate = 1;
        let scale = 1.5;
        let lastTime = 0;
        let policePoints = [];
        let thiefPoints = [];

        // 镜头参数
        let cameraX = 0;
        const cameraCenterRatio = 0.35;
        const maxCameraX = 1500;

        // ========== 初始化 ==========
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            drawVT();
        }

        function clearPaths() {
            policePoints = [];
            thiefPoints = [];
            policePath.setAttribute('d', '');
            thiefPath.setAttribute('d', '');
            distanceLine.setAttribute('x1', 0);
            distanceLine.setAttribute('y1', 0);
            distanceLine.setAttribute('x2', 0);
            distanceLine.setAttribute('y2', 0);
        }

        // 画坐标轴刻度：竖线每 10 m 一根，下方标白色数字 0、10、20、30……
        let lastRulerScale = 0;
        function drawRuler() {
            if (Math.abs(scale - lastRulerScale) < 0.0001) return;   // 比例没变就不重画
            lastRulerScale = scale;

            const trackLen = groundEl.offsetWidth;
            const step = 10;                            // 每小格 10 m
            const perStep = step * scale;               // 每小格对应的像素宽度
            // 比例被压得很扁时只标 50 m 的整数倍，否则数字会糊成一片
            const labelStep = perStep < 22 ? 50 : 10;

            let html = '';
            for (let d = 0; d * scale <= trackLen; d += step) {
                const x = (d * scale).toFixed(1);
                const major = (d % 50 === 0);
                html += '<line x1="' + x + '" y1="281" x2="' + x + '" y2="' + (major ? 295 : 290) +
                        '" stroke="' + (major ? '#8ec5fc' : '#4aa8ff') +
                        '" stroke-width="' + (major ? 2 : 1) + '"></line>';
                if (d % labelStep === 0) {
                    // 0 这个数字贴着最左端，用左对齐才不会被裁掉一半
                    const anchor = (d === 0) ? ' style="text-anchor:start"' : '';
                    html += '<text class="ruler-text" x="' + x + '" y="312"' + anchor + '>' + d + '</text>';
                }
            }
            rulerGroup.innerHTML = html;
        }

        function updateParams() {
            v1 = Number(v1Input.value);
            v2 = Number(v2Input.value);
            s0 = Number(s0Input.value);
            a1 = Number(a1Input.value);
            a2 = Number(a2Input.value);

            v1Val.textContent = v1;
            v2Val.textContent = v2;
            s0Val.textContent = s0;
            a1Val.textContent = a1.toFixed(1);
            a2Val.textContent = a2.toFixed(1);
            gapShow.textContent = s0 + ' m';

            const trackWidth = track.clientWidth - 80;
            scale = trackWidth / (s0 + 100);
            drawRuler();

            // 只有回到 t = 0 时才让角色回到出发位置；暂停中调参数保持当前位置
            if (time === 0) {
                policeEl.style.left = '0px';
                thiefEl.style.left = (s0 * scale) + 'px';
                updateOverlays(v1, v2, s0, 0, s0 * scale);
            }

            if (!running) {
                if (time === 0) clearPaths();
                drawVT();
            }
        }

        // 计算追及时间
        function getMeetTime() {
            const da = 0.5 * (a1 - a2);
            const dv = v1 - v2;
            const ds = -s0;

            if (Math.abs(da) < 0.001) {
                if (dv <= 0) return Infinity;
                return s0 / dv;
            }

            const delta = dv * dv - 4 * da * ds;
            if (delta < 0) return Infinity;

            const t1 = (-dv + Math.sqrt(delta)) / (2 * da);
            const t2 = (-dv - Math.sqrt(delta)) / (2 * da);
            const roots = [t1, t2].filter(t => t > 0.01);
            return roots.length > 0 ? Math.min(...roots) : Infinity;
        }

        // 追及结论文字（追不上时给出最小间距）
        function getConclusionText() {
            const t = getMeetTime();
            if (isFinite(t)) {
                return `✅ 可以追上：预计 t = ${t.toFixed(2)} s 时相遇`;
            }
            const A = 0.5 * (a2 - a1);
            const B = v2 - v1;
            if (A > 0.001) {
                const tm = -B / (2 * A);
                if (tm > 0) {
                    const minGap = s0 + B * tm + A * tm * tm;
                    return `❌ 追不上：t = ${tm.toFixed(2)} s 时两者速度相等，之后间距变大，最小间距 ${minGap.toFixed(1)} m`;
                }
            }
            return '❌ 追不上：间距会一直增大';
        }

        // ========== 画布浮层：速度箭头 + 间距文字 ==========
        // 角色脚底的 y 坐标
        function charFeetY(el) {
            const b = parseFloat(getComputedStyle(el).bottom) || 0;
            return track.clientHeight - b;
        }

        function charHeadY(el) {
            return charFeetY(el) - el.offsetHeight;
        }

        // 画速度箭头：长度 ∝ 速度大小，方向随速度正负
        function setArrow(line, cx, y, v) {
            const len = v * 5;                 // 5 px 表示 1 m/s
            if (Math.abs(len) < 2.5) {         // 速度太小时不画箭头
                line.setAttribute('visibility', 'hidden');
                return;
            }
            line.setAttribute('visibility', 'visible');
            line.setAttribute('x1', cx);
            line.setAttribute('y1', y);
            line.setAttribute('x2', cx + len);
            line.setAttribute('y2', y);
        }

        function updateOverlays(v1Now, v2Now, gap, policeX, thiefX) {
            const policeCX = policeX + policeEl.offsetWidth / 2;
            const thiefCX = thiefX + thiefEl.offsetWidth / 2;
            const headY1 = charHeadY(policeEl);
            const headY2 = charHeadY(thiefEl);
            const arrowY1 = headY1 - 16;
            const arrowY2 = headY2 - 16;

            setArrow(policeArrow, policeCX, arrowY1, v1Now);
            setArrow(thiefArrow, thiefCX, arrowY2, v2Now);

            policeVLabel.setAttribute('x', policeCX);
            policeVLabel.setAttribute('y', arrowY1 - 8);
            policeVLabel.textContent = 'v₁ = ' + v1Now.toFixed(1) + ' m/s';

            thiefVLabel.setAttribute('y', arrowY2 - 8);
            thiefVLabel.setAttribute('x', thiefCX);
            thiefVLabel.textContent = 'v₂ = ' + v2Now.toFixed(1) + ' m/s';

            // 间距：红色字写在警察脚下（取绝对值，反超后仍然实时变化）
            const gapAbs = Math.abs(gap);
            gapLabel.setAttribute('x', policeCX);
            gapLabel.setAttribute('y', charFeetY(policeEl) + 16);
            gapLabel.textContent = '间距 ' + gapAbs.toFixed(1) + ' m' + (gap < -0.05 ? '（警察在前）' : '');
        }

        // ========== 绘制 v-t 图 ==========
        function drawVT() {
            const w = canvas.width / 2;
            const h = canvas.height / 2;
            const padL = 40, padB = 30, padT = 20, padR = 20;

            ctx.clearRect(0, 0, w, h);

            const meetTime = getMeetTime();
            const tRef = isFinite(meetTime) ? meetTime * 1.3 : 15;
            const maxT = Math.max(Math.min(tRef, 100), time * 1.2, 10);
            const v1End = v1 + a1 * maxT;
            const v2End = v2 + a2 * maxT;
            const minV = Math.min(v1, v2, v1End, v2End, 0) - 2;
            const maxV = Math.max(v1, v2, v1End, v2End, 0) + 2;
            const vRange = maxV - minV;

            const tScale = (w - padL - padR) / maxT;
            const vScale = (h - padT - padB) / vRange;
            const zeroY = h - padB + minV * vScale;

            // 坐标轴
            ctx.strokeStyle = '#4aa8ff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(padL, padT);
            ctx.lineTo(padL, h - padB);
            ctx.moveTo(padL, zeroY);
            ctx.lineTo(w - padR, zeroY);
            ctx.stroke();

            // 网格
            ctx.strokeStyle = 'rgba(74, 168, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const tx = padL + i * (w - padL - padR) / 10;
                ctx.beginPath();
                ctx.moveTo(tx, padT);
                ctx.lineTo(tx, h - padB);
                ctx.stroke();

                const ty = padT + i * (h - padT - padB) / 10;
                ctx.beginPath();
                ctx.moveTo(padL, ty);
                ctx.lineTo(w - padR, ty);
                ctx.stroke();
            }

            const v1Now = v1 + a1 * time;
            const v2Now = v2 + a2 * time;

            // 警察速度线 + 面积
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(padL, zeroY - v1 * vScale);
            ctx.lineTo(padL + time * tScale, zeroY - v1Now * vScale);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 107, 53, 0.2)';
            ctx.beginPath();
            ctx.moveTo(padL, zeroY);
            ctx.lineTo(padL, zeroY - v1 * vScale);
            ctx.lineTo(padL + time * tScale, zeroY - v1Now * vScale);
            ctx.lineTo(padL + time * tScale, zeroY);
            ctx.closePath();
            ctx.fill();

            // 小偷速度线 + 面积
            ctx.strokeStyle = '#8ec5fc';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(padL, zeroY - v2 * vScale);
            ctx.lineTo(padL + time * tScale, zeroY - v2Now * vScale);
            ctx.stroke();

            ctx.fillStyle = 'rgba(142, 197, 252, 0.2)';
            ctx.beginPath();
            ctx.moveTo(padL, zeroY);
            ctx.lineTo(padL, zeroY - v2 * vScale);
            ctx.lineTo(padL + time * tScale, zeroY - v2Now * vScale);
            ctx.lineTo(padL + time * tScale, zeroY);
            ctx.closePath();
            ctx.fill();

            // 标签
            ctx.fillStyle = '#a8d8ff';
            ctx.font = '12px sans-serif';
            ctx.fillText('v/(m/s)', padL + 5, padT + 15);
            ctx.fillText('t/s', w - padR - 20, zeroY + 18);

            ctx.fillStyle = '#ff6b35';
            ctx.fillText('v₁=' + v1, padL + 10, zeroY - v1 * vScale - 5);
            ctx.fillStyle = '#8ec5fc';
            ctx.fillText('v₂=' + v2, padL + 10, zeroY - v2 * vScale - 5);
        }

        // ========== 动画主循环 ==========
        function animate(ts) {
            if (!running) return;

            if (!lastTime) lastTime = ts;
            const dt = (ts - lastTime) / 1000 * rate;
            lastTime = ts;

            time += dt;

            const s1 = v1 * time + 0.5 * a1 * time * time;
            const s2 = v2 * time + 0.5 * a2 * time * time;
            const gap = s0 + s2 - s1;

            // 物理坐标
            const policePhysicalX = s1 * scale;
            const thiefPhysicalX = (s0 + s2) * scale;

            // 镜头跟随
            const triggerX = track.clientWidth * cameraCenterRatio;
            if (policePhysicalX > triggerX) {
                cameraX = policePhysicalX - triggerX;
                cameraX = Math.min(cameraX, maxCameraX);
            } else {
                cameraX = 0;
            }

            // 跑道层整体左移（镜头推进）
            trackLayer.style.transform = `translateX(${-cameraX}px)`;

            // 角色屏幕坐标 = 物理坐标 - 镜头偏移
            const policeScreenX = policePhysicalX - cameraX;
            const thiefScreenX = thiefPhysicalX - cameraX;

            policeEl.style.left = policeScreenX + 'px';
            thiefEl.style.left = thiefScreenX + 'px';

            // 轨迹画在跑道层坐标系中：两条轨迹都以各自的「位置」为起点，
            // 不再偏移半个身位 —— 同地出发时两条虚线完全重合
            const policeTrailX = policePhysicalX;
            const policePathY = 229;
            const thiefTrailX = thiefPhysicalX;
            const thiefPathY = 237;
            const thiefFootY = 280;

            policePoints.push({ x: policeTrailX, y: policePathY });
            thiefPoints.push({ x: thiefTrailX, y: thiefPathY });

            policePath.setAttribute('d', policePoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' '));
            thiefPath.setAttribute('d', thiefPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' '));

            // 黄色距离线
                distanceLine.setAttribute('x1', policeTrailX);
                distanceLine.setAttribute('y1', thiefFootY);
                distanceLine.setAttribute('x2', thiefTrailX);
                distanceLine.setAttribute('y2', thiefFootY);

            // 速度箭头 + 间距文字（每帧刷新）
            updateOverlays(v1 + a1 * time, v2 + a2 * time, gap, policePhysicalX, thiefPhysicalX);

            // 更新数据
            timeShow.textContent = time.toFixed(2) + ' s';
            s1Show.textContent = Math.abs(s1).toFixed(1) + ' m';
            s2Show.textContent = Math.abs(s2).toFixed(1) + ' m';
            gapShow.textContent = Math.abs(gap).toFixed(1) + ' m';

            // 追及判定
            if (gap <= 0) {
                meetTip.classList.add('show');
            }

            drawVT();
            rafId = requestAnimationFrame(animate);
        }

        // ========== 事件绑定 ==========
        // 开始 / 暂停：每按一次切换一次
        function setStartButton() {
            startBtn.textContent = running ? '暂停' : '开始';
            startBtn.classList.toggle('running', running);
        }

        startBtn.addEventListener('click', () => {
            cancelAnimationFrame(rafId);   // 防止快速连点时出现多条动画循环
            if (running) {
                running = false;      // 暂停：保留当前进度，下次接着跑
                lastTime = 0;
            } else {
                lastTime = 0;
                running = true;
                if (time === 0) meetTip.classList.remove('show');
                rafId = requestAnimationFrame(animate);
            }
            setStartButton();
        });

        // 看做质点 / 还原角色
        particleBtn.addEventListener('click', () => {
            const on = document.body.classList.toggle('particle-mode');
            particleBtn.textContent = on ? '还原角色' : '看做质点';
            particleBtn.classList.toggle('active', on);
        });

        resetBtn.addEventListener('click', () => {
            running = false;
            time = 0;
            lastTime = 0;
            cameraX = 0;
            meetTip.classList.remove('show');
            clearPaths();
            trackLayer.style.transform = 'translateX(0)';
            presetNote.classList.remove('show');
            cancelAnimationFrame(rafId);
            setStartButton();
            updateParams();
            timeShow.textContent = '0 s';
            s1Show.textContent = '0 m';
            s2Show.textContent = '0 m';
        });

        // 应用一组预设参数，并回到初始状态
        function applyPreset(pv1, pv2, ps0, pa1, pa2) {
            running = false;
            time = 0;
            lastTime = 0;
            cameraX = 0;
            meetTip.classList.remove('show');
            clearPaths();
            trackLayer.style.transform = 'translateX(0)';
            cancelAnimationFrame(rafId);
            setStartButton();

            v1Input.value = pv1;
            v2Input.value = pv2;
            s0Input.value = ps0;
            a1Input.value = pa1;
            a2Input.value = pa2;

            updateParams();

            timeShow.textContent = '0 s';
            s1Show.textContent = '0 m';
            s2Show.textContent = '0 m';

            presetNote.textContent = getConclusionText();
            presetNote.classList.add('show');
        }

        // 预设 0：同时同地同向
        // 初始距离 s₀ = 0；警察 v₁ = 0、a₁ = 2 m/s²（由静止匀加速）；小偷 v₂ = 10 m/s（匀速）
        preset3Btn.addEventListener('click', () => {
            applyPreset(0, 10, 0, 2, 0);
        });

        // 预设 1：匀速追匀加速
        // 警察 v₁ = 10 m/s（匀速 a₁ = 0）；小偷 v₂ = 0（静止起步），a₂ = 2 m/s²；初始距离 s₀ = 30 m
        presetBtn.addEventListener('click', () => {
            applyPreset(10, 0, 30, 0, 2);
        });

        // 预设 2：匀加速追匀速
        // 警察 v₁ = 0、a₁ = 2 m/s²（由静止匀加速）；小偷 v₂ = 10 m/s（匀速 a₂ = 0）；初始距离 s₀ = 40 m
        preset2Btn.addEventListener('click', () => {
            applyPreset(0, 10, 40, 2, 0);
        });

        v1Input.addEventListener('input', updateParams);
        v2Input.addEventListener('input', updateParams);
        s0Input.addEventListener('input', updateParams);
        a1Input.addEventListener('input', updateParams);
        a2Input.addEventListener('input', updateParams);
        [v1Input, v2Input, s0Input, a1Input, a2Input].forEach(el => {
            el.addEventListener('input', () => presetNote.classList.remove('show'));
        });
        speedRate.addEventListener('change', () => {
            rate = Number(speedRate.value);
        });

        // 给两个角色各挂一个质点小圆（默认隐藏，由「看做质点」按钮切换）
        [policeEl, thiefEl].forEach(el => {
            const dot = document.createElement('div');
            dot.className = 'particle';
            el.appendChild(dot);
        });

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            resizeCanvas();
            updateParams();
            setStartButton();
        });
        window.addEventListener('resize', () => {
            resizeCanvas();
            updateParams();   // 窗口变化后重新计算比例并刷新坐标轴刻度
        });
    </script>
  <script>
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  });
  
  document.addEventListener('mousedown', function(e) {
    if (e.button === 2) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });
  
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 80) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.keyCode === 27) { saveScrollAndReturn(); }
  });
  
  document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
  document.addEventListener('paste', function(e) { e.preventDefault(); return false; });
  document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
  
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  document.addEventListener('selectstart', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      return false;
    }
  });
  
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
    return false;
  });
  </script>
</body>
