<div class="container">
    <div class="header">
        <div class="title">⚙️ 钢球冲上竖直半圆轨道</div>
        <span class="badge">内轨道约束 · 弹性碰撞</span>
    </div>

                <span>200</span><span style="color:#e0a040;">√(2gR)≈380</span><span style="color:#5cb878;">√(5gR)=600</span><span>750</span>

<script>
(function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('wrapper');
    const hint = document.getElementById('hint');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnLaunch = document.getElementById('btnLaunch');
    const btnReset = document.getElementById('btnReset');
    const btnAuto = document.getElementById('btnAuto');

    // ========== 物理与几何参数 ==========
    const R = 120;                  // 轨道基准半径
    const TRACK_THICK = 16;         // 轨道厚度
    const BALL_RADIUS = 10;         // 小球半径
    const G = 600;                   // 重力加速度

    const TRACK_INNER = R - TRACK_THICK / 2;   // 轨道内壁半径
    const TRACK_OUTER = R + TRACK_THICK / 2;   // 轨道外壁半径
    const TRACK_INNER_EFFECTIVE = TRACK_INNER - BALL_RADIUS; // 小球中心运动半径

    const GROUND_Y = 360;           // 地面线Y坐标（视觉位置）
    const BALL_GROUND_Y = GROUND_Y - BALL_RADIUS; // 小球接触地面时的球心Y坐标

    const CENTER_X = 450;            // 轨道圆心X坐标
    const CENTER_Y = GROUND_Y - TRACK_INNER; // 轨道圆心Y坐标（保证轨道最低点与地面相切）

    const ENTRY_X = CENTER_X;        // 轨道入口X（最低点）
    const ENTRY_Y = CENTER_Y + TRACK_INNER_EFFECTIVE; // 入口处小球球心Y（与地面对齐）
    const START_X = 100;             // 小球初始X
    const START_Y = ENTRY_Y;         // 小球初始Y（与地面、入口对齐）

    const V_REACH_TOP = Math.sqrt(2 * G * R);
    const V_PASS = Math.sqrt(5 * G * R);

    // ========== 状态管理 ==========
    const STATE = { IDLE: 0, APPROACH: 1, ON_TRACK: 2, DETACHED: 3, EXITED: 4, GROUNDED: 5 };
    let simState = STATE.IDLE;
    let ballX = START_X, ballY = START_Y;
    let ballVx = 450, ballVy = 0;
    let theta = Math.PI / 2;
    let trackMovingUp = true;
    let trail = [];
    let autoMode = false, autoTimer = null;
    let currentV0 = 450;

    // ========== 工具函数 ==========
    function getPosFromTheta(th) {
        return {
            x: CENTER_X + TRACK_INNER_EFFECTIVE * Math.cos(th),
            y: CENTER_Y + TRACK_INNER_EFFECTIVE * Math.sin(th)
        };
    }

    function tangentVec(th, movingUp) {
        return movingUp
            ? { x: Math.sin(th), y: -Math.cos(th) }
            : { x: -Math.sin(th), y: Math.cos(th) };
    }

    function reset() {
        simState = STATE.IDLE;
        ballX = START_X;
        ballY = START_Y;
        ballVx = currentV0;
        ballVy = 0;
        theta = Math.PI / 2;
        trackMovingUp = true;
        trail = [];
        hint.style.display = 'block';
    }

    function launch() {
        reset();
        simState = STATE.APPROACH;
        ballVx = currentV0;
        trail = [{ x: ballX, y: ballY }];
        hint.style.display = 'none';
    }

    function detach(th, movingUp) {
        const h = R * (1 - Math.sin(th));
        const vSq = Math.max(0, currentV0 * currentV0 - 2 * G * h);
        const v = Math.sqrt(vSq);
        const tv = tangentVec(th, movingUp);

        ballVx = v * tv.x;
        ballVy = v * tv.y;

        const pos = getPosFromTheta(th);
        ballX = pos.x;
        ballY = pos.y;

        simState = STATE.DETACHED;
        trail.push({ x: ballX, y: ballY, detach: true });
    }

    function handleTrackCollision() {
        const dx = ballX - CENTER_X;
        const dy = ballY - CENTER_Y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < TRACK_INNER_EFFECTIVE) return false;

        const angle = Math.atan2(dy, dx);
        // 仅在轨道覆盖的角度范围内处理碰撞（右半圆：-π/2 ~ π/2）
        if (angle < -Math.PI/2 || angle > Math.PI/2) {
            if (ballY >= BALL_GROUND_Y) {
                ballY = BALL_GROUND_Y;
                ballVy = 0;
                simState = STATE.GROUNDED;
                trail.push({ x: ballX, y: ballY });
                return true;
            }
            return false;
        }

        // 法向反弹
        const nx = dx / dist;
        const ny = dy / dist;
        const vn = ballVx * nx + ballVy * ny;

        ballVx -= 2 * vn * nx;
        ballVy -= 2 * vn * ny;

        // 拉回有效半径
        ballX = CENTER_X + TRACK_INNER_EFFECTIVE * nx;
        ballY = CENTER_Y + TRACK_INNER_EFFECTIVE * ny;

        trail.push({ x: ballX, y: ballY, bounce: true });
        return true;
    }

    // ========== 物理更新 ==========
    function updatePhysics(dt) {
        const maxDt = 1 / 30;
        const steps = Math.max(1, Math.floor(dt / maxDt));
        const subDt = dt / steps;

        for (let s = 0; s < steps; s++) {
            switch (simState) {
                case STATE.APPROACH:
                    ballX += ballVx * subDt;
                    if (ballX >= ENTRY_X) {
                        ballX = ENTRY_X;
                        ballY = ENTRY_Y;
                        simState = STATE.ON_TRACK;
                        theta = Math.PI / 2;
                        trackMovingUp = true;
                        trail.push({ x: ballX, y: ballY });
                    }
                    break;

                case STATE.ON_TRACK: {
                    const sinT = Math.sin(theta);
                    const h = R * (1 - sinT);
                    let vSq = currentV0 * currentV0 - 2 * G * h;

                    // 速度为零，开始下滑
                    if (trackMovingUp && vSq <= 0) {
                        const maxSin = 1 - (currentV0 * currentV0) / (2 * G * R);
                        theta = Math.asin(Math.max(-1, Math.min(1, maxSin)));
                        vSq = 0;
                        trackMovingUp = false;
                    }

                    const v = Math.sqrt(Math.max(0, vSq));

                    // 法向力为零，脱离轨道
                    const N_over_m = vSq / TRACK_INNER_EFFECTIVE + G * sinT;
                    if (N_over_m < -0.1 && v > 0.8) {
                        detach(theta, trackMovingUp);
                        break;
                    }

                    // 低速微动处理
                    if (v < 0.5) {
                        const a_t = -G * Math.cos(theta);
                        if (trackMovingUp && a_t < -0.01) trackMovingUp = false;
                        else if (!trackMovingUp && a_t > 0.01) trackMovingUp = true;

                        const smallV = 0.6;
                        const dTheta = (trackMovingUp ? -smallV : smallV) / TRACK_INNER_EFFECTIVE * subDt;
                        theta += dTheta;
                    } else {
                        const dTheta = (trackMovingUp ? -v : v) / TRACK_INNER_EFFECTIVE * subDt;
                        theta += dTheta;
                    }

                    // 到达最高点（通过）
                    if (trackMovingUp && theta <= -Math.PI / 2) {
                        theta = -Math.PI / 2;
                        const pos = getPosFromTheta(theta);
                        ballX = pos.x;
                        ballY = pos.y;

                        const tv = tangentVec(theta, trackMovingUp);
                        ballVx = v * tv.x;
                        ballVy = v * tv.y;

                        simState = STATE.EXITED;
                        trail.push({ x: ballX, y: ballY });
                        break;
                    }

                    // 滑回最低点，进入地面匀速状态
                    if (!trackMovingUp && theta >= Math.PI / 2) {
                        theta = Math.PI / 2;
                        ballX = ENTRY_X;
                        ballY = ENTRY_Y;
                        ballVx = -currentV0; // 机械能守恒，速度大小与初速度相等，方向向左
                        ballVy = 0;
                        simState = STATE.GROUNDED;
                        trail.push({ x: ballX, y: ballY });
                        break;
                    }

                    // 更新位置
                    const pos = getPosFromTheta(theta);
                    ballX = pos.x;
                    ballY = pos.y;
                    break;
                }

                case STATE.DETACHED:
                    ballVy += G * subDt;
                    ballX += ballVx * subDt;
                    ballY += ballVy * subDt;

                    if (handleTrackCollision()) break;

                    // 落地，进入地面匀速状态
                    if (ballY >= BALL_GROUND_Y) {
                        ballY = BALL_GROUND_Y;
                        ballVy = 0;
                        simState = STATE.GROUNDED;
                        trail.push({ x: ballX, y: ballY });
                    }
                    break;

                case STATE.EXITED:
                    ballVy += G * subDt;
                    ballX += ballVx * subDt;
                    ballY += ballVy * subDt;

                    // 落地，进入地面匀速状态
                    if (ballY >= BALL_GROUND_Y) {
                        ballY = BALL_GROUND_Y;
                        ballVy = 0;
                        simState = STATE.GROUNDED;
                    }
                    if (ballX < -50 || ballX > W + 50) simState = STATE.GROUNDED;
                    break;

                case STATE.GROUNDED:
                    // 地面无摩擦，水平匀速直线运动
                    if (ballVy === 0 && ballY === BALL_GROUND_Y) {
                        ballX += ballVx * subDt;
                    }
                    // 飞出屏幕后自动重置（自动模式下）
                    if ((ballX > W + 80 || ballX < -80) && autoMode) {
                        scheduleAuto();
                    }
                    break;
            }
        }

        // 记录轨迹
        if (simState !== STATE.IDLE && simState !== STATE.GROUNDED) {
            const now = performance.now() / 1000;
            if (!trail.lastTime || now - trail.lastTime > 0.03) {
                trail.push({ x: ballX, y: ballY });
                trail.lastTime = now;
                if (trail.length > 500) trail.shift();
            }
        }
    }

    // ========== 自动演示 ==========
    function scheduleAuto() {
        if (!autoMode) return;
        clearTimeout(autoTimer);
        autoTimer = setTimeout(() => {
            if (autoMode) {
                const speeds = [280, 340, 380, 410, 500, 650, 720];
                currentV0 = speeds[Math.floor(Math.random() * speeds.length)];
                speedSlider.value = currentV0;
                updateSpeedDisplay();
                launch();
            }
        }, 1800);
    }

    // ========== 绘制 ==========
    const W = 900, H = 500;

    function drawScene() {
        ctx.clearRect(0, 0, W, H);

        // 背景网格
        ctx.fillStyle = '#ffffff06';
        for (let i = 0; i < W; i += 35) {
            for (let j = 0; j < H; j += 35) {
                ctx.fillRect(i, j, 1, 1);
            }
        }

        // 地面
        ctx.fillStyle = '#1e2030';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        
        // 地面纹理
        ctx.fillStyle = '#2a2c3c';
        for (let x = 20; x < W; x += 45) {
            ctx.fillRect(x, GROUND_Y + 4, 15, 3);
            ctx.fillRect(x + 20, GROUND_Y + 14, 12, 2);
        }
        
        // 地面线
        ctx.strokeStyle = '#4a4c60';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(W, GROUND_Y);
        ctx.stroke();

        // 木质轨道（右半圆槽）
        ctx.save();
        ctx.beginPath();
        // 外圆弧：最高点到最低点，顺时针
        ctx.arc(CENTER_X, CENTER_Y, TRACK_OUTER, -Math.PI/2, Math.PI/2, false);
        // 连接到最低点内端点
        ctx.lineTo(CENTER_X, CENTER_Y + TRACK_INNER);
        // 内圆弧：最低点到最高点，逆时针
        ctx.arc(CENTER_X, CENTER_Y, TRACK_INNER, Math.PI/2, -Math.PI/2, true);
        // 闭合路径
        ctx.closePath();

        // 渐变填充
        const grad = ctx.createLinearGradient(CENTER_X, CENTER_Y - TRACK_OUTER, CENTER_X, CENTER_Y + TRACK_OUTER);
        grad.addColorStop(0, '#b07a4c');
        grad.addColorStop(0.5, '#d4a373');
        grad.addColorStop(1, '#7a4d2e');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#4a2a15';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // 内壁高亮线
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, TRACK_INNER, -Math.PI/2, Math.PI/2, false);
        ctx.strokeStyle = '#ffd8a8';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // 关键点标记
        // 最高点
        ctx.fillStyle = '#ffffff60';
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y - TRACK_INNER, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ccc';
        ctx.font = '11px "Segoe UI", "PingFang SC", "Microsoft YaHei"';
        ctx.fillText('最高点', CENTER_X + 8, CENTER_Y - TRACK_INNER - 6);

        // 最低点（相切点）
        ctx.fillStyle = '#ffcc8080';
        ctx.beginPath();
        ctx.arc(CENTER_X, GROUND_Y, 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffcc80';
        ctx.font = '11px "Segoe UI", "PingFang SC", "Microsoft YaHei"';
        ctx.fillText('轨道最低点', CENTER_X + 8, GROUND_Y + 14);

        // 轨迹线
        if (trail.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = '#ffaa30';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            for (let i = 1; i < trail.length; i++) {
                const p = trail[i];
                if (p.detach) {
                    ctx.fillStyle = '#ff5555';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    continue;
                }
                if (p.bounce) {
                    ctx.fillStyle = '#55ff55';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    continue;
                }
                ctx.moveTo(trail[i-1].x, trail[i-1].y);
                ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }

        // 小球
        if (simState !== STATE.IDLE) {
            drawBall(ballX, ballY);
            // 速度箭头
            if (simState === STATE.APPROACH || simState === STATE.DETACHED || simState === STATE.EXITED || simState === STATE.GROUNDED) {
                drawArrow(ballX, ballY, ballVx, ballVy);
            }
            if (simState === STATE.ON_TRACK) {
                const h = R * (1 - Math.sin(theta));
                const vSq = Math.max(0, currentV0 * currentV0 - 2 * G * h);
                const v = Math.sqrt(vSq);
                const tv = tangentVec(theta, trackMovingUp);
                drawArrow(ballX, ballY, v * tv.x, v * tv.y);
            }
        } else {
            drawBall(START_X, START_Y, 0.5);
        }
    }

    function drawBall(x, y, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;

        // 发光效果
        ctx.shadowColor = 'rgba(200, 220, 255, 0.7)';
        ctx.shadowBlur = 12;

        // 金属渐变
        const grad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, BALL_RADIUS);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, '#e0e0f0');
        grad.addColorStop(0.5, '#a0a0c0');
        grad.addColorStop(0.8, '#404060');
        grad.addColorStop(1, '#181830');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, BALL_RADIUS, 0, 2 * Math.PI);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#00000060';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 高光点
        ctx.fillStyle = '#ffffffc0';
        ctx.beginPath();
        ctx.arc(x - 2.5, y - 2.5, 2.2, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function drawArrow(x, y, vx, vy) {
        const speed = Math.sqrt(vx * vx + vy * vy);
        if (speed < 2) return;
        const sc = 0.2;
        const len = speed * sc;
        const ang = Math.atan2(vy, vx);
        const tipX = x + len * Math.cos(ang);
        const tipY = y + len * Math.sin(ang);

        ctx.save();
        ctx.strokeStyle = '#ffdd55';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        ctx.fillStyle = '#ffdd55';
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - 10 * Math.cos(ang - 0.7), tipY - 10 * Math.sin(ang - 0.7));
        ctx.lineTo(tipX - 10 * Math.cos(ang + 0.7), tipY - 10 * Math.sin(ang + 0.7));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // ========== 交互与初始化 ==========
    function updateSpeedDisplay() {
        currentV0 = parseInt(speedSlider.value);
        speedDisplay.textContent = currentV0 + ' px/s';
    }

    function resizeCanvas() {
        const rect = wrapper.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) {
            requestAnimationFrame(resizeCanvas);
            return;
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
    if (document.readyState === 'complete') resizeCanvas();
    else document.addEventListener('DOMContentLoaded', resizeCanvas);

    // 事件监听
    speedSlider.addEventListener('input', () => {
        updateSpeedDisplay();
        if (simState === STATE.IDLE || simState === STATE.GROUNDED) reset();
    });

    btnLaunch.addEventListener('click', () => {
        currentV0 = parseInt(speedSlider.value);
        updateSpeedDisplay();
        launch();
    });

    btnReset.addEventListener('click', () => {
        currentV0 = parseInt(speedSlider.value);
        updateSpeedDisplay();
        reset();
    });

    btnAuto.addEventListener('click', () => {
        autoMode = !autoMode;
        btnAuto.classList.toggle('active', autoMode);
        btnAuto.textContent = autoMode ? '🔄 自动(开)' : '🔄 自动演示';
        if (autoMode && (simState === STATE.IDLE || simState === STATE.GROUNDED)) {
            scheduleAuto();
        } else if (!autoMode) {
            clearTimeout(autoTimer);
        }
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
        if (e.code === 'Space') {
            e.preventDefault();
            btnLaunch.click();
        } else if (e.code === 'KeyR') {
            btnReset.click();
        } else if (e.code === 'KeyA') {
            btnAuto.click();
        } else if (e.code === 'ArrowLeft') {
            speedSlider.value = Math.max(200, parseInt(speedSlider.value) - 10);
            updateSpeedDisplay();
            if (simState === STATE.IDLE || simState === STATE.GROUNDED) reset();
        } else if (e.code === 'ArrowRight') {
            speedSlider.value = Math.min(750, parseInt(speedSlider.value) + 10);
            updateSpeedDisplay();
            if (simState === STATE.IDLE || simState === STATE.GROUNDED) reset();
        }
    });

    canvas.addEventListener('click', () => {
        if (simState === STATE.IDLE || simState === STATE.GROUNDED) {
            btnLaunch.click();
        }
    });

    // 启动动画循环
    let lastTime = performance.now() / 1000;
    function animate(ts) {
        const now = ts / 1000;
        let dt = now - lastTime;
        if (dt > 0.2) dt = 0.2;
        if (dt <= 0) dt = 1 / 60;
        lastTime = now;

        if (simState !== STATE.IDLE) updatePhysics(dt);
        drawScene();
        requestAnimationFrame(animate);
    }

    resizeCanvas();
    updateSpeedDisplay();
    reset();
    requestAnimationFrame(animate);
})();
</script>

<script>
(function(){
  var IS_HOME = (location.pathname.split('/').pop() === 'index.html' || location.pathname.split('/').pop() === '');

  /* 1. 禁用右键菜单 */
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); try{ e.returnValue = false; }catch(_){} return false; });
  /* 2. 鼠标右键按下直接吞掉 */
  document.addEventListener('mousedown', function(e){ if(e.button === 2){ e.preventDefault(); return false; } });
  document.addEventListener('mouseup',   function(e){ if(e.button === 2){ e.preventDefault(); return false; } });

  /* 3. 禁用快捷键 */
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;
    var blocked = false;
    /* F12 */
    if(e.key === 'F12'){ blocked = true; }
    /* Ctrl+U / S / P / C / V / X */
    if(ctrl && ['u','s','p','c','v','x'].indexOf(k) >= 0){ blocked = true; }
    /* Ctrl+Shift+I / J / C */
    if(ctrl && e.shiftKey && ['i','j','c'].indexOf(k) >= 0){ blocked = true; }
    if(blocked){ e.preventDefault(); try{ e.returnValue = false; }catch(_){} return false; }
    /* ESC 返回主页 */
    if(e.key === 'Escape' && !IS_HOME){
      location.href = 'index.html';
    }
  });

  /* 4. 禁用文本选择（input/textarea 放行） */
  document.addEventListener('selectstart', function(e){
    var tag = (e.target.tagName || '').toUpperCase();
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
  });
  /* 5. 禁用拖拽 */
  document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });

  /* 6. 注入 user-select 样式（input/textarea 仍可选） */
  var style = document.createElement('style');
  style.textContent = 'body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}img{-webkit-user-drag:none;user-drag:none;}';
  (document.head || document.documentElement).appendChild(style);

  /* 7. 主页滚动位置记忆 */
  if(IS_HOME){
    window.addEventListener('load', function(){
      var saved = parseInt(localStorage.getItem('qilai_scroll_top') || '0', 10);
      if(saved > 0){ window.scrollTo(0, saved); }
    });
    document.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a') : null;
      if(a){ localStorage.setItem('qilai_scroll_top', String(window.scrollY)); }
    }, true);
  }
})();

</script>
  <script>
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  });
  
  document.addEventListener('mousedown', function(e) {
    if (e.button === 2) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });
  
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.keyCode === 80) { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.keyCode === 27) { saveScrollAndReturn(); }
  });
  
  document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
  document.addEventListener('paste', function(e) { e.preventDefault(); return false; });
  document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
  
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  document.addEventListener('selectstart', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      return false;
    }
  });
  
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
    return false;
  });
  </script>
