<style>
*{box-sizing:border-box;}
body{margin:0;background:#eef0f3;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
#stage{position:relative;width:1414px;max-width:100%;margin:0 auto;background:#fff;overflow:hidden;}
#ggbApplet{width:1414px;max-width:100%;background:#fff;}
/* 8个大号步进按钮：贴在画布框内底部，一行排列，保证一屏可见 */
#btnRow{
  position:absolute;left:0;right:0;bottom:0;z-index:99;
  display:flex;flex-wrap:nowrap;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,.94);
  border-top:1px solid #d8dee5;
  box-shadow:0 -3px 8px rgba(0,0,0,.10);
}
#btnRow button{
  flex:1 1 0;min-width:0;height:56px;padding:0 4px;
  font:600 24px/1 "Microsoft YaHei","PingFang SC",sans-serif;
  color:#1f2d3d;background:#fff;border:2px solid #b9c0ca;border-radius:10px;
  cursor:pointer;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.08);
  transition:background .12s,border-color .12s,transform .06s;
}
#btnRow button:hover{background:#e8f2ff;border-color:#4a90e2;color:#1668dc;}
#btnRow button:active{transform:translateY(2px);background:#d6e8ff;}
#btnRow.locked button{opacity:.45;cursor:not-allowed;transform:none;}
</style>
</head>

<script>
// 与画布内 8 个小按钮完全等价的步进操作（锁止时不动）
function ggbStep(d){
  var api = window.ggbApi;
  if(!api) return;
  try{
    if(api.getValueString && api.getValueString('suozi') === 'true'){
      var row = document.getElementById('btnRow');
      row.classList.add('locked');
      setTimeout(function(){ row.classList.remove('locked'); }, 500);
      return;
    }
    var x = api.getXcoord('C'), y = api.getYcoord('C');
    api.evalCommand('SetValue[C,(' + (x + d) + ',' + y + ')]');
  }catch(e){ if(window.console) console.log(e); }
}
</script>
